<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>UI style isolation</title>
  </head>
  <body>
    <main id="unrelated">
      <h1>Unrelated content</h1>
      <button id="outside-button">Outside</button><input id="outside-input" />
      <div class="table-scroll">
        <table id="outside-table">
          <tbody>
            <tr>
              <td>Outside table</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <section id="light">
      <div class="filter-input">
        <input id="light-search" aria-label="light search" /><button
          id="light-clear"
          class="clear-input"
          type="button"
          aria-label="light clear"
        >
          ×
        </button>
      </div>
      <select
        id="light-select"
        class="ui-native-select"
        aria-label="light choice"
      >
        <option value="first">Choose a column</option>
        <option value="second">Second choice</option>
      </select>
      <select
        id="light-listbox"
        class="ui-native-select"
        multiple
        size="2"
        aria-label="light list"
      >
        <option>First</option>
        <option>Second</option>
      </select>
      <button id="light-button">Light</button><input /><textarea></textarea>
      <div class="table-scroll">
        <table>
          <tbody>
            <tr data-row style="height: var(--ui-row-height)">
              <td>Compact row</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    <section id="dark">
      <div class="filter-input">
        <input id="dark-search" aria-label="dark search" /><button
          id="dark-clear"
          class="clear-input"
          type="button"
          aria-label="dark clear"
        >
          ×
        </button>
      </div>
      <select
        id="dark-select"
        class="ui-native-select"
        aria-label="dark choice"
      >
        <option value="first">Choose a column</option>
        <option value="second">Second choice</option>
      </select>
      <select
        id="dark-listbox"
        class="ui-native-select"
        multiple
        size="2"
        aria-label="dark list"
      >
        <option>First</option>
        <option>Second</option>
      </select>
      <button id="dark-button">Dark</button><input />
      <div class="table-scroll">
        <table>
          <tbody>
            <tr data-row style="height: var(--ui-row-height)">
              <td>Dark row</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    <section id="comfortable">
      <div class="filter-input">
        <input id="comfortable-search" aria-label="comfortable search" /><button
          id="comfortable-clear"
          class="clear-input"
          type="button"
          aria-label="comfortable clear"
        >
          ×
        </button>
      </div>
      <select
        id="comfortable-select"
        class="ui-native-select"
        aria-label="comfortable choice"
      >
        <option value="first">Choose a column</option>
        <option value="second">Second choice</option>
      </select>
      <select
        id="comfortable-listbox"
        class="ui-native-select"
        multiple
        size="2"
        aria-label="comfortable list"
      >
        <option>First</option>
        <option>Second</option>
      </select>
      <button>Comfortable</button>
      <div class="table-scroll">
        <table>
          <tbody>
            <tr data-row style="height: var(--ui-row-height)">
              <td>Comfortable row</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    <script type="module" src="/main.ts"></script>
  </body>
</html>

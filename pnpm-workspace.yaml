packages:
  - examples/**/*
  # parked pending @tanstack/solid-form Solid 2 support (no Solid-2 release
  # line exists); source and docs nav stay in-tree — see the example's README
  - '!examples/solid/with-tanstack-form'
  - packages/*

overrides:
  # single @solidjs/web copy: solid-router 2.0.0-beta.28 pins 2.0.0-beta.27 as a
  # regular dependency; two copies would mean two template caches and two
  # event-delegation roots
  '@solidjs/web': 2.0.0-beta.29
  # The TanStack devtools UI stack is built on Solid 1 (it imports
  # `solid-js/web`, which solid-js@2 no longer exports). Once the solid
  # examples moved to solid-js@2, pnpm's peer dedupe re-resolved this family
  # against the workspace's solid-js 2 and broke the react/preact/vue/angular
  # example builds. Pin the family's nested solid-js to the 1.x line.
  # Remove when @tanstack/devtools ships a Solid 2 line (bead table-v3p.2).
  '@tanstack/devtools>solid-js': ^1.9.14
  '@tanstack/devtools-ui>solid-js': ^1.9.14
  '@tanstack/devtools-utils>solid-js': ^1.9.14
  '@tanstack/react-devtools>solid-js': ^1.9.14
  '@tanstack/preact-devtools>solid-js': ^1.9.14
  '@tanstack/vue-devtools>solid-js': ^1.9.14
  '@tanstack/angular-devtools>solid-js': ^1.9.14
  '@tanstack/form-devtools>solid-js': ^1.9.14
  '@types/react': 19.2.16
  '@tanstack/alpine-table': 'workspace:*'
  '@tanstack/angular-table-devtools': 'workspace:*'
  '@tanstack/angular-table': 'workspace:*'
  '@tanstack/ember-table': 'workspace:*'
  '@tanstack/lit-table': 'workspace:*'
  '@tanstack/match-sorter-utils': 'workspace:*'
  '@tanstack/octane-table': 'workspace:*'
  '@tanstack/preact-table-devtools': 'workspace:*'
  '@tanstack/preact-table': 'workspace:*'
  '@tanstack/react-table-devtools': 'workspace:*'
  '@tanstack/react-table': 'workspace:*'
  '@tanstack/solid-table-devtools': 'workspace:*'
  '@tanstack/solid-table': 'workspace:*'
  '@tanstack/svelte-table': 'workspace:*'
  '@tanstack/table-core': 'workspace:*'
  '@tanstack/table-devtools': 'workspace:*'
  '@tanstack/vue-table-devtools': 'workspace:*'
  '@tanstack/vue-table': 'workspace:*'

packageExtensions:
  # Solid 2 transition (remove at Solid 2 GA): testing-library's `>=2.0.0`
  # peers do not match 2.0.0-beta.x prereleases, and vite-plugin-solid 3 has
  # not yet added jest-dom ^7 to its peer range.
  '@solidjs/testing-library':
    peerDependencies:
      solid-js: '>=2.0.0-0 <3.0.0'
      '@solidjs/web': '>=2.0.0-0 <3.0.0'
  vite-plugin-solid:
    peerDependencies:
      '@testing-library/jest-dom': '^5.16.6 || ^6.0.0 || ^7.0.0'
  '@analogjs/vite-plugin-angular':
    peerDependencies:
      '@angular/compiler': '^17.0.0 || ^18.0.0 || ^19.0.0 || ^20.0.0 || ^21.0.0 || ^22.0.0'
    peerDependenciesMeta:
      '@angular/compiler':
        optional: true
  # solid-query 6.0.0-beta.6's build output imports @solidjs/web but its
  # manifest declares only the solid-js peer — a phantom dependency that
  # resolves through pnpm's hoisted fallback. With two @solidjs/web peer
  # variants in the workspace (the devtools family nests a solid-js@1 one),
  # the fallback is ambiguous and broke the solid-query example builds.
  # Declare the peer so pnpm links the variant matching each importer.
  '@tanstack/solid-query':
    peerDependencies:
      '@solidjs/web': '>=2.0.0-0 <3.0.0'

allowBuilds:
  # root dependency
  nx: true
  unrs-resolver: false # not directly required for build
  esbuild: true

  # @angular/build
  '@parcel/watcher': false # optional dep of @angular/build
  lmdb: false # optional dep of @angular/build
  msgpackr-extract: false # optional dep of @angular/build

  # @tanstack/vue-store
  vue-demi: false # only required for vue 2 support
  core-js-pure: false

cleanupUnusedCatalogs: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@tanstack/octane-store@0.12.1'

linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: true
trustPolicy: 'no-downgrade'
trustPolicyExclude:
  - ember-modifier@4.3.0
  - chokidar@4.0.3
  - semver@5.7.2 || 6.3.1
